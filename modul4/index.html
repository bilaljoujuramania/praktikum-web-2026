
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Portofolio Proyek - Modul 4</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            padding: 30px 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            padding: 15px;
            text-align: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .stat-card h3 {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a8a;
            overflow-wrap: anywhere;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-filter {
            padding: 8px 16px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-filter.active,
        .btn-filter:hover {
            background: #1e3a8a;
            color: #ffffff;
            border-color: #1e3a8a;
        }

        .btn-filter:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 3px;
        }

        .project-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 16px;
            margin-bottom: 12px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            transition: transform 0.15s ease;
        }

        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .project-info {
            min-width: 0;
        }

        .project-info h4 {
            font-size: 16px;
            color: #0f172a;
            margin-bottom: 4px;
            overflow-wrap: anywhere;
        }

        .project-category {
            display: inline-block;
            font-size: 12px;
            color: #0284c7;
            background: #e0f2fe;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .project-budget {
            font-size: 14px;
            color: #334155;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge-pending {
            background: #fef9c3;
            color: #854d0e;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }

            .container {
                padding: 18px;
            }

            .project-card {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Portofolio Proyek</h1>

        <p class="subtitle">
            Modul 4: Pengolahan Logika Data &amp; Interaktivitas DOM
        </p>

        <!-- Statistik proyek -->
        <section class="stats-grid" aria-label="Statistik proyek">
            <div class="stat-card">
                <h3>Total Proyek</h3>
                <p id="stat-total-projects">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Anggaran</h3>
                <p id="stat-total-budget">Rp 0</p>
            </div>

            <div class="stat-card">
                <h3>Selesai Dikerjakan</h3>
                <p id="stat-completed-projects">0</p>
            </div>
        </section>

        <!-- Filter kategori -->
        <nav class="filter-group" aria-label="Filter kategori proyek">
            <button
                type="button"
                class="btn-filter active"
                data-category="Semua"
                aria-pressed="true"
            >
                Semua Proyek
            </button>

            <button
                type="button"
                class="btn-filter"
                data-category="Web App"
                aria-pressed="false"
            >
                Web App
            </button>

            <button
                type="button"
                class="btn-filter"
                data-category="Desktop App"
                aria-pressed="false"
            >
                Desktop App
            </button>

            <button
                type="button"
                class="btn-filter"
                data-category="Mobile App"
                aria-pressed="false"
            >
                Mobile App
            </button>
        </nav>

        <!-- Daftar proyek diisi oleh JavaScript -->
        <section id="project-list" aria-label="Daftar proyek">
            <p>Memuat daftar proyek...</p>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
